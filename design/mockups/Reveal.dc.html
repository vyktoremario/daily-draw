<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Daily Draw — Tonight's draw</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;family=Space+Grotesk:wght@500;700&amp;display=swap">
<style>
body{margin:0}
a{color:#F5B92E}a:hover{color:#FFD36B}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #0E2B22; color: #FFFFFF; font-family: Inter, system-ui, sans-serif; display: flex; flex-direction: column; padding: 24px 20px 28px">
  <header style="display: flex; align-items: center; justify-content: space-between">
    <a href="Main.dc.html" aria-label="Close" style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; border-radius: 12px; color: #FFFFFF">
      <svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 6l12 12"></path><path d="M18 6L6 18"></path></svg>
    </a>
    <span style="font-size: 13px; font-weight: 600; color: #CDE3D8; display: flex; align-items: center; gap: 8px"><span style="width: 8px; height: 8px; border-radius: 999px; background: #F5B92E"></span>LIVE · 9:00pm</span>
    <span style="width: 44px"></span>
  </header>

  <div style="display: flex; flex-direction: column; align-items: center; text-align: center; gap: 6px; margin-top: 28px">
    <span style="font-size: 14px; color: #CDE3D8">Draw #313 · Mon 23 Nov</span>
    <span style="font-size: 15px; color: #CDE3D8">Tonight's pool</span>
    <span style="font-family: 'Space Grotesk', sans-serif; font-weight: 700; font-size: 40px; letter-spacing: -0.03em; color: #F5B92E">₦1,184,000</span>
  </div>

  <div aria-live="polite" aria-label="{{ariaNumber}}" style="display: flex; justify-content: center; gap: 14px; margin-top: 40px">
    <div style="width: 120px; height: 150px; border-radius: 24px; display: flex; align-items: center; justify-content: center; font-family: 'Space Grotesk', sans-serif; font-weight: 700; font-size: 96px; {{slot1Style}}">{{d1}}</div>
    <div style="width: 120px; height: 150px; border-radius: 24px; display: flex; align-items: center; justify-content: center; font-family: 'Space Grotesk', sans-serif; font-weight: 700; font-size: 96px; {{slot2Style}}">{{d2}}</div>
  </div>

  <p style="margin: 24px 0 0; text-align: center; font-size: 17px; font-weight: 600; min-height: 24px">{{status}}</p>

  <sc-if value="{{done}}" hint-placeholder-val="{{ true }}">
    <div style="margin-top: 20px; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; text-align: center">
      <div style="background: rgba(255,255,255,0.08); border-radius: 14px; padding: 12px 6px"><div style="font-size: 12px; color: #CDE3D8">Winners</div><div style="font-weight: 700; font-size: 18px; margin-top: 2px">37</div></div>
      <div style="background: rgba(255,255,255,0.08); border-radius: 14px; padding: 12px 6px"><div style="font-size: 12px; color: #CDE3D8">Each wins</div><div style="font-weight: 700; font-size: 18px; margin-top: 2px">₦32,000</div></div>
      <div style="background: rgba(255,255,255,0.08); border-radius: 14px; padding: 12px 6px"><div style="font-size: 12px; color: #CDE3D8">Tickets</div><div style="font-weight: 700; font-size: 18px; margin-top: 2px">15,787</div></div>
    </div>
  </sc-if>

  <div style="margin-top: auto; display: flex; flex-direction: column; gap: 10px">
    <sc-if value="{{done}}" hint-placeholder-val="{{ true }}">
      <a href="Win.dc.html" style="display: flex; align-items: center; justify-content: center; min-height: 56px; border-radius: 14px; background: #F5B92E; color: #15171A; font-weight: 700; font-size: 18px; text-decoration: none">See my tickets</a>
    </sc-if>
    <div style="display: flex; justify-content: center; gap: 20px; font-size: 14px; font-weight: 600">
      <button type="button" onClick="{{replay}}" style="min-height: 44px; padding: 0 8px; background: none; border: none; color: #F5B92E; font-family: Inter, sans-serif; font-weight: 600; font-size: 14px; cursor: pointer">Watch again</button>
      <a href="Verify.dc.html" style="min-height: 44px; display: flex; align-items: center">Check this draw</a>
    </div>
    <p style="margin: 0; text-align: center; font-size: 12px; color: #A9C7B8; line-height: 1.5">The animation is just for show. The number was fixed by the maths the moment the public random value arrived.</p>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { phase: 2, r1: '8', r2: '8' };
  }
  componentDidMount() { this.start(); }
  componentWillUnmount() { this.stop(); }
  stop() { clearInterval(this.spin); clearTimeout(this.t1); clearTimeout(this.t2); }
  start() {
    this.stop();
    this.setState({ phase: 0 });
    const rnd = () => String(Math.floor(Math.random() * 10));
    this.spin = setInterval(() => {
      const p = this.state.phase;
      if (p === 0) this.setState({ r1: rnd(), r2: rnd() });
      else if (p === 1) this.setState({ r2: rnd() });
    }, 70);
    this.t1 = setTimeout(() => this.setState({ phase: 1, r1: '8' }), 1800);
    this.t2 = setTimeout(() => { clearInterval(this.spin); this.setState({ phase: 2, r2: '8' }); }, 3400);
  }
  renderVals() {
    const p = this.state.phase;
    const rolling = 'background: rgba(255,255,255,0.08); color: #CDE3D8; border: 2px solid rgba(255,255,255,0.12)';
    const locked = 'background: #FFFFFF; color: #0E2B22; border: 2px solid #F5B92E';
    return {
      d1: this.state.r1, d2: this.state.r2,
      slot1Style: p >= 1 ? locked : rolling,
      slot2Style: p >= 2 ? locked : rolling,
      status: p === 0 ? 'Drawing…' : (p === 1 ? 'First digit is 8…' : 'Tonight’s number is 88'),
      ariaNumber: p === 2 ? 'Winning number 88' : 'Drawing',
      done: p === 2,
      replay: () => this.start()
    };
  }
}
</script>
</body>
</html>
