[profile.default]
src = "src"
test = "test"
script = "script"
out = "out"
libs = ["lib"]
solc_version = "0.8.28"
optimizer = true
optimizer_runs = 200
fuzz = { runs = 1000 }
remappings = [
  "@openzeppelin/contracts/=lib/openzeppelin-contracts/contracts/",
  "@openzeppelin/contracts-upgradeable/=lib/openzeppelin-contracts-upgradeable/contracts/",
  "forge-std/=lib/forge-std/src/",
]
# Settlement vectors shared with packages/shared (read by tests from #26 on).
fs_permissions = [{ access = "read", path = "../shared/test-vectors" }]

[fmt]
line_length = 100
