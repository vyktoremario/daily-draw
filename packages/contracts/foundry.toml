[profile.default]
src = "src"
test = "test"
script = "script"
out = "out"
libs = ["lib"]
solc_version = "0.8.28"
optimizer = true
optimizer_runs = 200
fuzz = { runs = 1000 }
# Invariant suite (test/invariant, #28): each invariant gets `runs` random sequences of `depth`
# handler calls. Rejected actions are expected (the handler tries them on purpose), so a revert
# doesn't fail a run. Raise runs locally with FOUNDRY_INVARIANT_RUNS=1000 for a deeper search.
invariant = { runs = 256, depth = 100, fail_on_revert = false }
remappings = [
  "@openzeppelin/contracts/=lib/openzeppelin-contracts/contracts/",
  "@openzeppelin/contracts-upgradeable/=lib/openzeppelin-contracts-upgradeable/contracts/",
  "forge-std/=lib/forge-std/src/",
]
# Settlement vectors shared with packages/shared (read by tests from #26 on).
fs_permissions = [
  { access = "read", path = "../shared/test-vectors" },
  # DeployLocal writes deployments/<chainId>.json for the web app (pnpm dev:chain); SetFee reads
  # the testnet addresses from deployments/<network>.json.
  { access = "read-write", path = "./deployments" },
]

[fmt]
line_length = 100
