name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  typescript:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: dailydraw
          POSTGRES_PASSWORD: dailydraw
          POSTGRES_DB: dailydraw
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U dailydraw" --health-interval 2s --health-timeout 3s --health-retries 20
    env:
      DATABASE_URL: postgres://dailydraw:dailydraw@localhost:5432/dailydraw
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - name: Migrations apply to a fresh database
        run: pnpm db:migrate
      - run: pnpm build

  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true # our remappings use our own pinned OpenZeppelin copies
      - uses: foundry-rs/foundry-toolchain@v1
      - run: forge fmt --check
        working-directory: packages/contracts
      - run: forge test -vvv
        working-directory: packages/contracts
